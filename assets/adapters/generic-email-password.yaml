# Minimal email+password signup, no mailbox required.
# Use when the target does not verify the email at signup.
name: generic-email-password
description: Email and password only
mode: browser
stealth: true
engine: auto
vars:
  signup_url: "https://example.com/signup"
steps:
  - goto: "{{signup_url}}"
  - wait_for: "input[type=email]"
  - fill:
      target: "input[type=email]"
      value: "{{email}}"
  - fill:
      target: "input[type=password]"
      value: "{{password}}"
  - action: fill
    target: "input[name*=name i]"
    value: "{{full_name}}"
    optional: true
  - click:
      target: "button[type=submit]"
  - wait_for:
      target: "text=Welcome"
      timeout: 30
verify:
  url: "{{signup_url}}"
  selector: "text=Sign out"
