# Supabase / GoTrue email+password signup with a confirmation link.
# The link query parameter is `token`; the verify API expects `token_hash`.
# Configure an IMAP/catch-all mailbox first (see references/two-phase.md).
# Set `mail.defer: true` and move the verify block to `verify` if the target
# rate-limits confirmation mail.
name: supabase-email-password
description: Supabase GoTrue signup, confirm link, password, verify
mode: protocol
protocol:
  impersonate: chrome
vars:
  supabase_url: "https://YOUR-PROJECT.supabase.co"
  anon_key: "PUBLIC-ANON-KEY"
  site_url: "https://target.example"
  initialize_path: "/v1/user/signup/initialize"   # service-specific; optional
mail:
  provider: imap
  create: false
  alias:
    template: "{user}+{tag}@gmail.com"
    tag_prefix: sb
  search: 'TO "{address}"'
  mailboxes: [INBOX, "[Gmail]/All Mail"]
  link_regex: 'https://[^\s"<>]+/auth/v1/verify[^\s"<>]*'
  timeout: 300
steps:
  - request:
      method: POST
      url: "{{supabase_url}}/auth/v1/signup"
      headers:
        apikey: "{{anon_key}}"
        X-Client-Info: supabase-js-web/2.45.0
        Origin: "{{site_url}}"
        Referer: "{{site_url}}/"
      json:
        email: "{{email}}"
        password: "{{password}}"
        data: {}
        gotrue_meta_security: {}
      expect: [200, 201]
      save: signup
  - otp:
      link_regex: 'https://[^\s"<>]+/auth/v1/verify[^\s"<>]*'
      timeout: 300
  - extract:
      from: otp_link
      regex: '[?&]token=([^&]+)'
      group: 1
      as: confirm_token
  - request:
      method: POST
      url: "{{supabase_url}}/auth/v1/verify"
      headers:
        apikey: "{{anon_key}}"
      json:
        type: signup
        token_hash: "{{confirm_token}}"
      expect: 200
      save: session
  - extract:
      from: session
      path: access_token
      as: access_token
  - request:
      method: PUT
      url: "{{supabase_url}}/auth/v1/user"
      headers:
        apikey: "{{anon_key}}"
        Authorization: "Bearer {{access_token}}"
      json:
        password: "{{password}}"
      expect: [200, 204]
  # Service-specific: create org / API key here. Example:
  # - request:
  #     method: POST
  #     url: "{{api_base}}{{initialize_path}}"
  #     headers: {Authorization: "Bearer {{access_token}}"}
  #     expect: [200, 201]
  # - request:
  #     method: POST
  #     url: "{{api_base}}/v1/user/api-keys"
  #     headers: {Authorization: "Bearer {{access_token}}"}
  #     json: {name: "autoreg"}
  #     expect: [200, 201]
  #     save: api_key
  # - extract: {from: api_key, path: key, as: key}
verify:
  request:
    method: GET
    url: "{{supabase_url}}/auth/v1/user"
    headers:
      apikey: "{{anon_key}}"
      Authorization: "Bearer {{access_token}}"
    expect: 200
